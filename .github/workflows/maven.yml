name: Java CI

on: [push]

jobs:
  build-full:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: 25.0.4+101.0.LTS
        distribution: 'temurin'
        cache: 'maven'
    - run: mvn --batch-mode --show-version verify
